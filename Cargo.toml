[workspace]
resolver = "2"
members = [
    "crates/vinted-core",
    "crates/vinted-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["ezraclintoc"]
repository = "https://github.com/ezraclintoc/vinted-cli"
homepage = "https://github.com/ezraclintoc/vinted-cli"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "zstd", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"

# CLI-only
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
comfy-table = "7"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = "z"

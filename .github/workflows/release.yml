# Builds release binaries and attaches them to a GitHub Release.
#
# Deliberately NOT triggered by tags or pushes: binaries are produced only
# when you publish a release (manually, from the GitHub UI or
# `gh release create`).

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux musl)
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} -p vinted-cli

      - name: Build (native)
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }} -p vinted-cli

      - name: Stage binaries
        shell: bash
        run: |
          NAME="vinted-${{ matrix.target }}"
          mkdir -p upload
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/vinted.exe" "upload/${NAME}.exe"
          else
            cp "target/${{ matrix.target }}/release/vinted" "upload/${NAME}"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" upload/* --clobber
